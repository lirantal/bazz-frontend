version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    # Action v2 requires CLI v3, which does not support Yarn Classic.
    ignore:
      - dependency-name: "changesets/action"
        versions: [">=2.0.0"]
    schedule:
      interval: "monthly"
    commit-message:
      # Prefix all commit messages with "chore: "
      prefix: "chore"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 30
    # Use the 'dependencies' default label and add
    # the 'automerge' one for automerge github action support
    labels:
      - "dependencies"
      - "automerge"

  - package-ecosystem: "npm"
    directory: "/"
    # Revisit after migrating away from Yarn Classic.
    ignore:
      - dependency-name: "@changesets/cli"
        versions: [">=3.0.0"]
      - dependency-name: "@changesets/changelog-github"
        versions: [">=1.0.0"]
    commit-message:
      # Prefix all commit messages with "chore: "
      prefix: "chore"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 30
      semver-major-days: 30
      semver-minor-days: 30
      semver-patch-days: 30
    # Use the 'dependencies' default label and add
    # the 'automerge' one for automerge github action support
    labels:
      - "dependencies"
      - "automerge"
    groups:
      # Production dependencies without breaking changes
      dependencies:
        dependency-type: "production"
        update-types:
        - "minor"
        - "patch"
      # Production dependencies with breaking changes
      dependencies-major:
        dependency-type: "production"
        update-types:
        - "major"
      # Development dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
        - "minor"
        - "patch"
    # example for ignoring dependencies:
    # ignore:
    #   - dependency-name: tap
    #     update-types: ["version-update:semver-major"]

